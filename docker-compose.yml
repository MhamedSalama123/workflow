# Local development services for WorkFlow.
# Start with:  docker compose up -d
services:
  postgres:
    # pgvector image = PostgreSQL 16 + the vector extension we need in Phase 4
    image: pgvector/pgvector:pg16
    container_name: workflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: workflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-workflow-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: workflow-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

volumes:
  postgres-data:
  minio-data:
