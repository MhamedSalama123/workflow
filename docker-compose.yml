# Local development services for WorkFlow.
# Start with:  docker compose up -d
services:
  postgres:
    # pgvector image = PostgreSQL 16 + the vector extension we need in Phase 4
    image: pgvector/pgvector:pg16
    container_name: workflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    # SeaweedFS: S3-compatible object storage for photos and attachments.
    # Dev-only credentials live in infra/seaweedfs/s3.json.
    image: chrislusf/seaweedfs:latest
    container_name: workflow-s3
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # file browser
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: workflow-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

volumes:
  postgres-data:
  s3-data:
